<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グローバル・クッキークリック</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #f39c12;
        }
        .counter {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .cookie-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .cookie {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            transition: transform 0.1s ease;
            object-fit: cover;
        }
        .cookie:active {
            transform: scale(0.92);
        }
        .stats {
            margin-top: 20px;
            font-size: 1rem;
            color: #b2bec3;
            background: #333333;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WORLDWIDE TOTAL</h1>
        <div class="counter" id="global-count">読み込み中...</div>

        <div class="cookie-container" id="click-btn">
            <!-- 同じフォルダ内にある cookie.png を読み込みます -->
            <img src="cookie.png" alt="Cookie" class="cookie" id="cookie-img">
        </div>

        <div class="stats">
            YOUR CLICKS: <span id="personal-count">0</span>
        </div>
    </div>

    <!-- Firebase SDKの読み込み (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // 自分のFirebase設定に書き換えてください
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyDcvlkcktn6LeyZvbq1kcoyxIu0FQ4m3dc",
  authDomain: "chat-10127.firebaseapp.com",
  databaseURL: "https://chat-10127-default-rtdb.firebaseio.com",
  projectId: "chat-10127",
  storageBucket: "chat-10127.firebasestorage.app",
  messagingSenderId: "622326024517",
  appId: "1:622326024517:web:ced326fd5863530090d62c",
        };

        // Firebaseの初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 要素の取得
        const globalCountEl = document.getElementById("global-count");
        const personalCountEl = document.getElementById("personal-count");
        const clickBtn = document.getElementById("click-btn");

        // ローカルストレージから自分のクリック数を読み込む
        let personalClicks = localStorage.getItem("my_clicks") ? parseInt(localStorage.getItem("my_clicks")) : 0;
        personalCountEl.textContent = personalClicks;

        // Firestoreのリアルタイム同期（世界全体の数値）
        const cookieRef = doc(db, "clicks", "global");
        onSnapshot(cookieRef, (docSnap) => {
            if (docSnap.exists()) {
                globalCountEl.textContent = docSnap.data().count.toLocaleString();
            } else {
                globalCountEl.textContent = "0";
            }
        });

        // クリックされたときの処理（トランザクションを使って安全に+1する）
        async function handleClick() {
            // 個人カウンターを即時増やす
            personalClicks++;
            personalCountEl.textContent = personalClicks;
            localStorage.setItem("my_clicks", personalClicks);

            // トランザクションでサーバーの数値を正確に+1する
            try {
                await runTransaction(db, async (transaction) => {
                    const docSnap = await transaction.get(cookieRef);
                    let newTotal = 1;
                    if (docSnap.exists()) {
                        newTotal = docSnap.data().count + 1;
                    }
                    transaction.set(cookieRef, { count: newTotal });
                });
            } catch (e) {
                console.error("クリックの保存に失敗しました: ", e);
            }
        }

        // イベントリスナーの登録（PCのクリック / スマホのタップ両対応）
        clickBtn.addEventListener("click", handleClick);
    </script>
</body>
</html>
